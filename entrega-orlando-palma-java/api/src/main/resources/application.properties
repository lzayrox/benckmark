# Puerto de la API (5002 para no chocar con las otras entregas del taller)
server.port=${PORT:5002}

# Hilos de Tomcat: se deja el valor por defecto de Spring Boot, explicito para que
# quede registrado en el informe cual fue la configuracion medida.
server.tomcat.threads.max=200
server.tomcat.accept-count=100

# Conexion a PostgreSQL por variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de HikariCP con 30 conexiones. minimum-idle igual al maximo para que el pool
# este completo desde el arranque y no crezca a mitad de la prueba de carga.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=30
spring.datasource.hikari.pool-name=orders-pool
spring.datasource.hikari.connection-timeout=10000

# Sin paginas de error con stacktrace ni endpoints extra
server.error.include-stacktrace=never
spring.jmx.enabled=false
